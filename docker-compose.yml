services:
  backend:
    build: ./backend
    env_file: .env
    environment:
      # Refuse to start, with this message, if DATABASE_URL is missing from .env.
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env (see README)}
    ports:
      - "8000:8000"
    healthcheck:
      # python:3.12-slim has no curl, so check /health with Python.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  frontend:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy
