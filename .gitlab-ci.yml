stages:
  - test

backend-test:
  stage: test
  image: python:3.12-slim
  script:
    - cd backend
    - pip install --no-cache-dir -r requirements.txt -r requirements-dev.txt
    - pytest -q

frontend-build:
  stage: test
  image: node:24-alpine
  script:
    - cd frontend
    - npm ci
    - npm run lint
    - npm run build
