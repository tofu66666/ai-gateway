server {
    listen 80;

    # Docker's built-in DNS server. Look "backend" up again every 10 s,
    # so a rebuilt backend container (new IP address) is still found.
    resolver 127.0.0.11 valid=10s;

    root /usr/share/nginx/html;
    index index.html;

    # Single-page app: unknown paths fall back to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Browser calls /api/health; the gateway receives /health.
    location /api/ {
        set $backend http://backend:8000;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $backend;
        # Pass streamed responses (chat completions with stream: true) straight through.
        proxy_buffering off;
    }
}
